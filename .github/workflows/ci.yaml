on: [push, pull_request]
name: CI

jobs:
  test:
    strategy:
      matrix:
        module: [., yaml, toml, hocon, vault, examples/multisource]
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -cover
