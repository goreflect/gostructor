<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="gostructorFaviconTitle">
  <title id="gostructorFaviconTitle">gostructor</title>
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ACD7"/>
      <stop offset="100%" stop-color="#0090B8"/>
    </linearGradient>
  </defs>

  <!-- rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)"/>

  <!-- curly braces around a filled struct: config -> struct -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- left brace { -->
    <path d="M22 16 q-6 0 -6 6 v4 q0 4 -4 6 q4 2 4 6 v4 q0 6 6 6"/>
    <!-- right brace } -->
    <path d="M42 16 q6 0 6 6 v4 q0 4 4 6 q-4 2 -4 6 v4 q0 6 -6 6"/>
  </g>

  <!-- three struct rows -->
  <g fill="#FFFFFF">
    <rect x="26" y="24" width="12" height="4" rx="2"/>
    <rect x="26" y="30" width="12" height="4" rx="2"/>
    <rect x="26" y="36" width="12" height="4" rx="2"/>
  </g>
</svg>
