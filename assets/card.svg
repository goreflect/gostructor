<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="gostructorCardTitle gostructorCardDesc">
  <title id="gostructorCardTitle">gostructor</title>
  <desc id="gostructorCardDesc">Config sources — env, yaml, json, vault — funnel into gostructor and fill a typed Go struct. Surprises are errors.</desc>

  <defs>
    <linearGradient id="cardSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAF7FB"/>
      <stop offset="100%" stop-color="#CBEBF4"/>
    </linearGradient>
    <linearGradient id="cardBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ACD7"/>
      <stop offset="100%" stop-color="#0090B8"/>
    </linearGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE14D"/>
      <stop offset="100%" stop-color="#FFC21A"/>
    </radialGradient>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.6" fill="#00ACD7" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- panel background + comic border -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#cardSky)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#halftone)"/>
  <rect x="14" y="14" width="1252" height="612" rx="26" fill="none" stroke="#0B2A33" stroke-width="10"/>

  <!-- ===== title ribbon ===== -->
  <g>
    <rect x="60" y="48" width="560" height="92" rx="16" fill="#0B2A33"/>
    <rect x="52" y="40" width="560" height="92" rx="16" fill="#FFFFFF" stroke="#0B2A33" stroke-width="6"/>
    <text x="80" y="104" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#0B2A33">go<tspan fill="#00ACD7">structor</tspan></text>
  </g>
  <!-- tag chips near title -->
  <g font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700">
    <rect x="640" y="52" width="86" height="34" rx="8" fill="#00ACD7" stroke="#0B2A33" stroke-width="4"/>
    <text x="683" y="76" fill="#FFFFFF" text-anchor="middle">cfg</text>
    <rect x="736" y="52" width="86" height="34" rx="8" fill="#FFE14D" stroke="#0B2A33" stroke-width="4"/>
    <text x="779" y="76" fill="#0B2A33" text-anchor="middle">gos</text>
  </g>

  <!-- ===== left: source chips ===== -->
  <g font-family="Menlo, Consolas, monospace" font-size="26" font-weight="800" text-anchor="middle">
    <!-- ENV -->
    <rect x="70" y="210" width="170" height="60" rx="12" fill="#FFFFFF" stroke="#0B2A33" stroke-width="6"/>
    <text x="155" y="250" fill="#0B2A33">ENV</text>
    <!-- YAML -->
    <rect x="70" y="290" width="170" height="60" rx="12" fill="#FFFFFF" stroke="#0B2A33" stroke-width="6"/>
    <text x="155" y="330" fill="#0B2A33">YAML</text>
    <!-- JSON -->
    <rect x="70" y="370" width="170" height="60" rx="12" fill="#FFFFFF" stroke="#0B2A33" stroke-width="6"/>
    <text x="155" y="410" fill="#0B2A33">JSON</text>
    <!-- VAULT -->
    <rect x="70" y="450" width="170" height="60" rx="12" fill="#FFFFFF" stroke="#0B2A33" stroke-width="6"/>
    <text x="155" y="490" fill="#0B2A33">VAULT</text>
  </g>

  <!-- converging arrows into the burst -->
  <g stroke="#0B2A33" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M244 240 C 360 240, 380 330, 470 350"/>
    <path d="M244 320 C 360 320, 400 345, 470 355"/>
    <path d="M244 400 C 360 400, 400 365, 470 360"/>
    <path d="M244 480 C 360 480, 380 390, 470 370"/>
  </g>

  <!-- ===== center: comic burst + engine ===== -->
  <g transform="translate(600,360)">
    <!-- starburst -->
    <path fill="url(#burst)" stroke="#0B2A33" stroke-width="7" stroke-linejoin="round"
      d="M0,-150 L30,-70 L118,-95 L70,-20 L150,25 L60,40 L95,128 L15,70 L0,155 L-20,70 L-100,120 L-58,38 L-150,20 L-70,-20 L-120,-95 L-30,-70 Z"/>
    <!-- engine badge -->
    <rect x="-96" y="-40" width="192" height="80" rx="16" fill="url(#cardBadge)" stroke="#0B2A33" stroke-width="6"/>
    <text x="0" y="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle">Configure()</text>
  </g>

  <!-- arrow burst -> struct -->
  <g stroke="#0B2A33" stroke-width="10" fill="#0B2A33" stroke-linecap="round" stroke-linejoin="round">
    <path d="M762 360 L 872 360" fill="none"/>
    <path d="M866 342 L 906 360 L 866 378 Z"/>
  </g>

  <!-- ===== right: filled struct card ===== -->
  <g transform="translate(920,214)">
    <rect x="10" y="12" width="290" height="256" rx="18" fill="#0B2A33"/>
    <rect x="0" y="0" width="290" height="256" rx="18" fill="#FFFFFF" stroke="#0B2A33" stroke-width="6"/>
    <!-- header -->
    <text x="24" y="52" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="800" fill="#0B2A33">Config {</text>
    <!-- rows: key + filled value -->
    <g font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700">
      <rect x="30" y="74" width="90" height="20" rx="5" fill="#0B3D45" fill-opacity="0.5"/>
      <rect x="140" y="74" width="120" height="20" rx="5" fill="#00ACD7"/>
      <rect x="30" y="110" width="70" height="20" rx="5" fill="#0B3D45" fill-opacity="0.5"/>
      <rect x="140" y="110" width="100" height="20" rx="5" fill="#00ACD7"/>
      <rect x="30" y="146" width="110" height="20" rx="5" fill="#0B3D45" fill-opacity="0.5"/>
      <rect x="160" y="146" width="80" height="20" rx="5" fill="#00ACD7"/>
      <!-- secret row: masked -->
      <rect x="30" y="182" width="80" height="20" rx="5" fill="#0B3D45" fill-opacity="0.5"/>
      <rect x="140" y="182" width="100" height="20" rx="5" fill="#0B2A33"/>
      <text x="150" y="199" fill="#FFE14D" font-size="18">••••••</text>
    </g>
    <text x="24" y="240" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="800" fill="#0B2A33">}</text>
    <!-- green check badge -->
    <circle cx="286" cy="18" r="26" fill="#37B24D" stroke="#0B2A33" stroke-width="5"/>
    <path d="M274 18 l8 9 l14 -17" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== bottom tagline ribbon ===== -->
  <g>
    <rect x="70" y="546" width="1140" height="58" rx="14" fill="#0B2A33"/>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700">
      <text x="262" y="585" fill="#FFFFFF">Fill any Go struct from any source.</text>
      <text x="708" y="585" fill="#FFE14D" font-weight="800">Surprises are errors.</text>
    </g>
  </g>
</svg>
