# Reproducible Vault for the example: a dev-mode server (root token "root") plus
# a one-shot seeder that enables a KV v1 mount and writes the demo secret.
#
# A KV *v1* mount is used because the core vault source reads flat secret data
# (secret.Data[key]); KV v2 nests values under a "data" sub-map. The seeder
# mounts kv/ as v1 so kv/orders/db#password resolves directly.
services:
  vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  seed:
    image: hashicorp/vault:1.18
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        vault secrets enable -version=1 -path=kv kv || true
        vault kv put kv/orders/db password=s3cr3t-pass max_conns=20
        echo "seeded kv/orders/db"
    restart: "no"
